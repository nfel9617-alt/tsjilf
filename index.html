<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#130080">
<meta name="color-scheme" content="light only">
<title>تسجيل الحضور | ورشات طموح</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#130080;--ink:#130080;--mut:#5a5a8a;--or:#f26a00;--line:#dcdcf0;--field:#f4f4fc}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:#130080;color-scheme:light only}
body{margin:0;background:#130080;font-family:'Cairo',Tahoma,Arial,sans-serif;color:#130080;padding:20px 14px 28px;min-height:100vh}
.wrap{width:100%;max-width:520px;margin:0 auto}
.brand{text-align:center;color:#fff;margin-bottom:14px}
.brand b{color:var(--or);font-size:36px;font-weight:900}
.brand small{display:block;opacity:.85;letter-spacing:1px}
.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
h1{font-size:22px;margin:0 0 6px;font-weight:900}
.meta{color:var(--mut);font-size:14px;margin:0 0 16px}
.meta span{color:var(--or);font-weight:700}
label{display:block;font-weight:700;margin:12px 0 6px;font-size:14px}
select,input{width:100%;min-height:52px;font-size:16px;padding:12px 14px;-webkit-appearance:none;appearance:none;border:2px solid var(--line);border-radius:12px;background:var(--field);color:var(--ink);font:inherit}
select:focus,input:focus{outline:none;border-color:var(--or)}
input[type=email]{direction:ltr;text-align:left}
.hp{position:absolute;width:1px;height:1px;min-height:0;padding:0;border:0;opacity:0;overflow:hidden;pointer-events:none}
button{width:100%;min-height:54px;margin-top:18px;border:0;border-radius:12px;padding:13px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;background:var(--or);color:#fff;font:inherit;font-weight:700;font-size:17px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.msg{margin-top:14px;padding:14px;border-radius:12px;font-size:15px;line-height:1.6;display:none}
@media (max-width:380px){.card{padding:16px}h1{font-size:19px}.brand b{font-size:30px}}
.ok{display:block;background:#e6f7ea;color:#14632b}
.err{display:block;background:#fde8e8;color:#9b1c1c}
</style>
</head>
<body>
<noscript><p style="color:#fff;text-align:center">فعّل JavaScript باش تسجّل.</p></noscript>
<div class="wrap">
  <div class="brand"><b>طموح</b><small>Tomouh</small></div>
  <div class="card">
    <h1>تسجيل الحضور</h1>
    <p class="meta" id="meta"></p>
    <form id="f" novalidate>
      <label for="name">الاسم الكامل</label>
      <input id="name" type="text" autocomplete="name" enterkeyhint="next" maxlength="100" placeholder="مثال: محمد بن علي">
      <label for="email">البريد الإلكتروني (لإرسال الشهادة)</label>
      <input id="email" type="email" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="send" autocomplete="email" maxlength="120" placeholder="name@example.com">
      <input class="hp" id="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button id="send" type="submit">سجّل حضوري</button>
    </form>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
// ===== الإعدادات: بدّل هذا الرابط برابط Apps Script بعد النشر =====
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyioxTgogyeQ_7R2vjMmaRkt5HK5O-AJkG3bFG1SgEQFB8k7gyP6lnl6e-KU3bNgRU5bg/exec';
// الورشات: المفتاح WORKSHOP هو اللي يتسجّل في الـ Sheet (لا تغيّره بعد بدء التسجيل)
var WORKSHOPS = {
  '1': { key: 'Podcasting & Content Creation - 06/10', ar: 'ورشة البودكاست وصناعة المحتوى', when: 'الثلاثاء 06/10 · 6:30 مساءً' },
  '2': { key: 'Spanish & Study Visa Application - 07/10', ar: 'ورشة اللغة الإسبانية وفيزا الدراسة', when: 'الأربعاء 07/10 · 6:30 مساءً' },
  '3': { key: 'Decision-Making & Daily Challenges - 10/10', ar: 'ورشة اتخاذ القرارات ومواجهة التحديات اليومية', when: 'السبت 10/10 · 6:00 مساءً' }
};
var DEFAULT_W = '2'; // الورشة الحالية. رابط خاص بكل ورشة: ?w=1 أو ?w=2 أو ?w=3
var wid = new URLSearchParams(location.search).get('w');
var W = WORKSHOPS[wid] || WORKSHOPS[DEFAULT_W];
var WORKSHOP = W.key, WORKSHOP_AR = W.ar, WORKSHOP_WHEN = W.when;
// ================================================================

document.getElementById('meta').innerHTML = WORKSHOP_AR + ' · <span>' + WORKSHOP_WHEN + '</span>';
var f = document.getElementById('f'), msg = document.getElementById('msg'), btn = document.getElementById('send');
function show(t, c){ msg.className = 'msg ' + c; msg.textContent = t; }

f.addEventListener('submit', async function(e){
  e.preventDefault();
  var name = document.getElementById('name').value.trim();
  var email = document.getElementById('email').value.trim();
  if (name.length < 3) return show('اكتب اسمك الكامل.', 'err');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return show('البريد الإلكتروني غير صحيح.', 'err');
  if (SCRIPT_URL.indexOf('PUT_YOUR') === 0) return show('لم يتم ربط الصفحة بالـ Google Sheet بعد.', 'err');

  btn.disabled = true;
  try {
    var r = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // يتفادى preflight
      body: JSON.stringify({ name: name, email: email, workshop: WORKSHOP, website: document.getElementById('website').value })
    });
    var j = await r.json();
    if (!j.ok) throw new Error(j.error || 'fail');
    f.style.display = 'none';
    show(j.duplicate ? 'أنت مسجّل من قبل ✅ الشهادة تجيك على الإيميل.' : 'تم تسجيلك ✅ شكراً ' + name + '، الشهادة تجيك على الإيميل بعد نهاية الورشة.', 'ok');
  } catch (err) {
    show('ما قدرناش نسجّلوك، حاول مرة أخرى.', 'err');
    btn.disabled = false;
  }
});
</script>
</body>
</html>
